name: Deploy nshex.enclavegames.com

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [counter-updated, roulette-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/checkout@v4
        with:
          repository: EnclaveGames/NSHex-Counter
          ref: main
          path: counter-src

      - uses: actions/checkout@v4
        with:
          repository: EnclaveGames/NSHex-Roulette
          ref: main
          path: roulette-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build apps
        run: |
          for app in counter roulette; do
            (cd $app-src && npm ci && npm run build)
          done

      - name: Assemble site
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' site/ public/
          for app in counter roulette; do
            out=public/$app
            mkdir -p $out/src/plugins
            cp $app-src/index.html $app-src/favicon.png $app-src/ept.webmanifest $out/
            [ -f $app-src/sw.js ] && cp $app-src/sw.js $out/
            cp -r $app-src/img $app-src/fonts $app-src/sfx $app-src/icons $out/
            cp $app-src/src/*.min.js $app-src/src/start.js $out/src/
            cp $app-src/src/plugins/webfont.js $out/src/plugins/
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
